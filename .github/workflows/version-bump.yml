name: Bump DEROX OS version

on:
  push:
    branches: [main]
    paths:
      - "iso/**"

# Serialize version changes for the main branch.
concurrency:
  group: derox-version-bump-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increment patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$current" =~ ^([0-9]+)\.([0-9]{2})$ ]]; then
            echo "VERSION must use MAJOR.MINOR format, for example 1.00" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          next_minor=$((10#$minor + 1))
          next="$(printf '%s.%d' "$major" "$next_minor")"
          printf '%s\n' "$next" > VERSION
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Commit version update safely
        env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Release DEROX OS v${NEXT_VERSION}"

          # Retry if another workflow updates main between fetch and push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main

            # Another queued run may already have published this same version.
            if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]; then
              echo "Version v${NEXT_VERSION} is already present on main."
              break
            fi

            if git push origin HEAD:main; then
              break
            fi

            if [[ "$attempt" -eq 5 ]]; then
              echo "Could not push version update after 5 attempts." >&2
              exit 1
            fi
            echo "main moved during push; retrying (attempt $((attempt + 1))/5)."
          done

      - name: Start ISO build for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-iso.yml --ref main
