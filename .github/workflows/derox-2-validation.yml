name: DEROX 2.0 validation
on:
  push:
    branches: [derox-2.0]
    paths: ["v2/**", ".github/workflows/derox-2-validation.yml"]
  pull_request:
    branches: [derox-2.0]
    paths: ["v2/**", ".github/workflows/derox-2-validation.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python tools
        run: python -m py_compile v2/tools/validate_manifest.py
      - name: Run validator tests
        working-directory: v2/tools
        run: python -m unittest -v test_validate_manifest.py
      - name: Validate sample manifest
        run: python v2/tools/validate_manifest.py v2/package/examples/demo-app.json
      - name: Compile source-lock tools
        run: python -m py_compile v2/tools/validate_sources.py
      - name: Run source-lock tests
        working-directory: v2/tools
        run: python -m unittest -v test_validate_sources.py
      - name: Validate source lock
        run: python v2/tools/validate_sources.py v2/sources/sources.json
      - name: Compile source fetcher
        run: python -m py_compile v2/tools/fetch_sources.py
      - name: Run source fetcher tests
        working-directory: v2/tools
        run: python -m unittest -v test_fetch_sources.py
      - name: Check build preflight shell syntax
        run: bash -n v2/build/host-check.sh
      - name: Check build preflight help
        run: bash v2/build/host-check.sh --help
      - name: Check wallpaper installer shell syntax
        run: bash -n v2/wallpapers/install-default.sh v2/wallpapers/test-install-default.sh
      - name: Test wallpaper integration into target rootfs
        run: bash v2/wallpapers/test-install-default.sh
      - name: Check GRUB theme scripts
        run: bash -n v2/bootloader/stage-theme.sh v2/bootloader/test-stage-theme.sh
      - name: Test GRUB theme staging
        run: bash v2/bootloader/test-stage-theme.sh
      - name: Check DEROX identity scripts
        run: bash -n v2/system/install-identity.sh v2/system/test-install-identity.sh
      - name: Test DEROX identity staging
        run: bash v2/system/test-install-identity.sh
      - name: Check build-gate scripts
        run: bash -n v2/build/check-build-gates.sh v2/build/test-check-build-gates.sh
      - name: Test empty source lock blocks build
        run: bash v2/build/test-check-build-gates.sh
      - name: Check kernel build scripts
        run: bash -n v2/kernel/build-kernel.sh v2/kernel/test-build-kernel.sh
      - name: Test kernel staging helper
        run: bash v2/kernel/test-build-kernel.sh

      - name: Check initramfs scripts
        run: bash -n v2/initramfs/create-initramfs.sh v2/initramfs/test-create-initramfs.sh
      - name: Test initramfs archive helper
        run: bash v2/initramfs/test-create-initramfs.sh
