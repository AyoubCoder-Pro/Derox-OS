name: DEROX 2.0 validation
on:
  push:
    branches: [derox-2.0]
    paths: ["v2/**", ".github/workflows/derox-2-validation.yml"]
  pull_request:
    branches: [derox-2.0]
    paths: ["v2/**", ".github/workflows/derox-2-validation.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python tools
        run: python -m py_compile v2/tools/validate-manifest.py
      - name: Run validator tests
        working-directory: v2/tools
        run: python -m unittest -v test_validate_manifest.py
      - name: Validate sample manifest
        run: python v2/tools/validate-manifest.py v2/package/examples/demo-app.json
