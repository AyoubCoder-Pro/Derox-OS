name: Build AYOUB OS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "iso/**"
      - "bin/ayoub"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build ISO in privileged Debian container
        run: |
          docker run --privileged --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work/iso \
            debian:bookworm \
            bash -lc '
              set -Eeuo pipefail
              apt-get update
              apt-get install -y live-build debootstrap squashfs-tools xorriso ca-certificates
              chmod +x build.sh config/hooks/live/0100-ayoub.hook.chroot
              ./build.sh
              lb build
            '

      - name: Prepare artifact
        run: |
          mkdir -p output
          test -f iso/live-image-amd64.hybrid.iso
          cp iso/live-image-amd64.hybrid.iso output/ayoub-os-debian12-xfce-amd64.iso
          sha256sum output/*.iso > output/SHA256SUMS.txt

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayoub-os-iso
          path: output/*
          if-no-files-found: error
          retention-days: 14
