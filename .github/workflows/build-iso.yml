name: Build AYOUB OS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "iso/**"
      - "bin/ayoub"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso

      - name: Configure image
        run: |
          chmod +x iso/build.sh
          cd iso
          sudo ./build.sh

      - name: Build ISO
        run: |
          cd iso
          sudo lb build

      - name: Prepare artifact
        run: |
          mkdir -p output
          sudo cp iso/live-image-amd64.hybrid.iso output/ayoub-os-debian12-xfce-amd64.iso
          sudo chown -R "$USER":"$USER" output
          sha256sum output/*.iso > output/SHA256SUMS.txt

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayoub-os-iso
          path: output/*
          if-no-files-found: error
          retention-days: 14
