name: Build DEROX OS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "VERSION"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build ISO in privileged Debian container
        run: |
          docker run --privileged --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work/iso \
            debian:bookworm \
            bash -lc '
              set -Eeuo pipefail
              apt-get update
              apt-get install -y live-build debootstrap squashfs-tools xorriso ca-certificates
              chmod +x build.sh config/hooks/live/0100-derox.hook.chroot
              ./build.sh
              lb build
            '

      - name: Prepare artifact
        run: |
          mkdir -p output
          test -f iso/live-image-amd64.hybrid.iso
          VERSION="$(cat VERSION)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp iso/live-image-amd64.hybrid.iso "output/DEROX-OS-v${VERSION}-amd64.iso"
          # GitHub Releases rejects individual assets >= 2 GiB.
          # Compress the ISO so it can be published as a single downloadable asset.
          xz -T0 -6 "output/DEROX-OS-v${VERSION}-amd64.iso"
          test "$(stat -c%s "output/DEROX-OS-v${VERSION}-amd64.iso.xz")" -lt 2147483648
          sha256sum output/*.iso.xz > output/SHA256SUMS.txt


      - name: Publish direct ISO download as a testing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: DEROX OS v${{ env.VERSION }} — Testing Preview
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            output/*.iso.xz
            output/SHA256SUMS.txt

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: derox-os-iso
          path: output/*
          if-no-files-found: error
          retention-days: 14
