name: Build AYOUB OS ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "iso/**"
      - "bin/ayoub"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y live-build debootstrap squashfs-tools xorriso ca-certificates git

      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure image
        run: |
          chmod +x iso/build.sh iso/config/hooks/live/0100-ayoub.hook.chroot
          cd iso
          ./build.sh

      - name: Build ISO
        run: |
          cd iso
          lb build

      - name: Prepare artifact
        run: |
          mkdir -p output
          cp iso/live-image-amd64.hybrid.iso output/ayoub-os-debian12-xfce-amd64.iso
          sha256sum output/*.iso > output/SHA256SUMS.txt

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayoub-os-iso
          path: output/*
          if-no-files-found: error
          retention-days: 14
